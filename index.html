<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qui Veut Gagner des Millions - Prototype</title>
  <style>
    :root {
      --bg: #0a0f2d;
      --card: #121a44;
      --accent: #f6c343;
      --ok: #4ade80;
      --bad: #fb7185;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: radial-gradient(circle at top, #1b2a72, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .app {
      width: min(880px, 100%);
      background: rgba(18, 26, 68, 0.95);
      border: 1px solid rgba(246, 195, 67, 0.25);
      border-radius: 18px;
      padding: 1.25rem;
      box-shadow: 0 20px 40px rgba(2, 6, 23, 0.5);
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .pill {
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      background: #0f1638;
      border: 1px solid #334155;
      font-size: 0.9rem;
    }
    .timer { color: var(--accent); font-weight: 700; }
    .question {
      margin: 1rem 0;
      padding: 1rem;
      border-radius: 12px;
      background: #0f1638;
      border: 1px solid rgba(148, 163, 184, 0.25);
      line-height: 1.4;
    }
    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .answer {
      text-align: left;
      background: #16204f;
      color: var(--text);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 0.85rem;
      cursor: pointer;
      font-weight: 600;
    }
    .answer:hover { border-color: var(--accent); }
    .status { margin-top: 1rem; color: var(--muted); }
    .good { color: var(--ok); }
    .bad { color: var(--bad); }
    .jokers { margin-top: 1rem; display: flex; gap: .5rem; flex-wrap: wrap; }
    .joker {
      background: #1d2b63;
      border: 1px solid #475569;
      color: var(--text);
      border-radius: 8px;
      padding: 0.5rem 0.7rem;
      font-size: .85rem;
    }
    .footer-note { margin-top: 1rem; font-size: .85rem; color: var(--muted); }
    @media (max-width: 700px){ .answers{grid-template-columns: 1fr;} }
  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <h1>🎯 QVGDM — Prototype Web</h1>
      <div class="pill">Temps: <span id="timer" class="timer">10</span>s</div>
    </div>

    <div class="pill">Points: <strong id="points">0</strong></div>

    <section class="question" id="question"></section>

    <section class="answers" id="answers"></section>

    <div class="jokers">
      <button class="joker" disabled>Joker gratuit du jour ✅</button>
      <button class="joker" disabled>Joker payant 1 💳</button>
      <button class="joker" disabled>Joker payant 2 💳</button>
    </div>

    <p id="status" class="status">Répondez avant la fin du timer.</p>
    <p class="footer-note">Démo MVP: timer 10s, élimination sur mauvaise réponse, progression en points.</p>
  </main>

  <script>
    const questions = [
      {
        text: "Combien de temps le joueur a-t-il pour répondre ?",
        answers: ["10 secondes", "30 secondes", "15 secondes", "5 secondes"],
        correct: 0,
        points: 100
      },
      {
        text: "Combien de tentatives gratuites par jour ?",
        answers: ["1", "2", "3", "Illimité"],
        correct: 1,
        points: 200
      }
    ];

    let qIndex = 0;
    let timer = 10;
    let points = 0;
    let interval;

    const timerEl = document.getElementById('timer');
    const pointsEl = document.getElementById('points');
    const questionEl = document.getElementById('question');
    const answersEl = document.getElementById('answers');
    const statusEl = document.getElementById('status');

    function endGame(reason){
      clearInterval(interval);
      answersEl.innerHTML = '';
      statusEl.className = 'status bad';
      statusEl.textContent = reason + ' Partie terminée.';
    }

    function startTimer(){
      clearInterval(interval);
      timer = 10;
      timerEl.textContent = timer;
      interval = setInterval(() => {
        timer--;
        timerEl.textContent = timer;
        if(timer <= 0){
          endGame('⏰ Temps écoulé.');
        }
      }, 1000);
    }

    function renderQuestion(){
      const q = questions[qIndex];
      if(!q){
        clearInterval(interval);
        statusEl.className = 'status good';
        statusEl.textContent = '🎉 Bravo, vous avez terminé cette démo.';
        questionEl.textContent = 'Fin de la démo';
        answersEl.innerHTML = '';
        return;
      }

      questionEl.textContent = q.text;
      answersEl.innerHTML = '';
      q.answers.forEach((label, idx) => {
        const button = document.createElement('button');
        button.className = 'answer';
        button.textContent = label;
        button.addEventListener('click', () => {
          if(idx !== q.correct){
            endGame('❌ Mauvaise réponse.');
            return;
          }
          points += q.points;
          pointsEl.textContent = points;
          statusEl.className = 'status good';
          statusEl.textContent = `✅ Bonne réponse ! +${q.points} points`;
          qIndex += 1;
          renderQuestion();
          startTimer();
        });
        answersEl.appendChild(button);
      });
      statusEl.className = 'status';
      statusEl.textContent = 'Répondez avant la fin du timer.';
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        endGame('🚫 Sortie de la page détectée.');
      }
    });

    renderQuestion();
    startTimer();
  </script>
</body>
</html>
